services:
  - type: web
    name: jcer-erp-backend
    runtime: node
    plan: free # Change to 'starter' ($7/mo) for persistent compute without sleep
    rootDir: Admission_process/backend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: jcer-erp-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://jcererp-system.pages.dev
      - key: FRONTEND_URL
        value: https://jcererp-system.pages.dev

databases:
  - name: jcer-erp-postgres
    databaseName: college_erp_db
    user: erp_user
    plan: free # Note: Render free database expires after 30 days. Upgrade to starter ($7/mo) for persistent data.

